# Supply chain security — mitigate compromised package attacks
# See: https://pnpm.io/supply-chain-security
#
# minimumReleaseAge: delay installing newly published versions (in minutes).
# 7 days = 10080 min — malicious releases are usually detected within hours,
# so a week-long quarantine practically eliminates the risk.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
    - qs
    - playcanvas

# blockExoticSubdeps: only direct deps may use git repos / tarball URLs;
# transitive deps must come from the registry.
blockExoticSubdeps: true

# trustPolicy: fail if a package's trust level has decreased compared to
# previous releases (e.g. was published by a trusted publisher but now isn't).
trustPolicy: no-downgrade
# Allow older packages that were published before trust/provenance infrastructure
# existed — 90 days (129600 min) grace window.
trustPolicyIgnoreAfter: 129600

# Catalog - single source of truth for dependency versions
# Using conservative versions to minimize migration risk
catalog:
    # TypeScript toolchain - unified to 5.8.3 for consistent compilation across monorepo
    typescript: ^5.8.3

    # i18next ecosystem - downgraded to stable 23.x due to TypeScript 5.8 incompatibility
    # i18next 24.x uses 'const' type parameters syntax that causes parsing errors in TS 5.8
    # Version 23.16.8 is proven stable and widely used
    # react-i18next pinned to 15.5.3 (last version compatible with i18next 23.x without requiring 24.x)
    i18next: 23.16.8
    react-i18next: 15.5.3
    i18next-http-backend: ^2.7.0
    i18next-browser-languagedetector: ^8.0.2

    # React ecosystem - current stable
    react: ^18.3.1
    react-dom: ^18.3.1
    '@types/react': ^18.3.18
    '@types/react-dom': ^18.3.5

    # React Router - bumped to 6.30.4 (fixes GHSA-2j2x-hqr9-3h42 open redirect);
    # keep react-router and react-router-dom in lockstep (dom pins router exactly)
    react-router: ^6.30.4
    react-router-dom: ^6.30.4

    # Build tools and bundlers
    # PINNED: tsdown 0.15.7 - newer versions use rolldown 1.0.0-beta.45 which generates
    # broken CJS code with __esm() wrappers that fail on circular dependencies
    # See: circular deps issue in some packages (storageUtils <-> utils)
    tsdown: 0.15.7
    vite: ^5.4.19
    '@vitejs/plugin-react': ^4.3.4
    vitest: ^2.1.8

    # MUI ecosystem - v9.x (one coordinated Core/X policy)
    # Keep exact versions here so every workspace package resolves one MUI major and patch line.
    '@mui/material': 9.2.0
    '@mui/icons-material': 9.2.0
    '@mui/system': 9.2.0
    '@mui/utils': 9.2.0
    '@emotion/react': ^11.14.0
    '@emotion/styled': ^11.14.1

    # MUI X - Advanced components (v9.x)
    # Required by the dashboard/runtime templates and aligned with Material UI v9.
    '@mui/x-charts': 9.8.0
    '@mui/x-data-grid': 9.8.0
    '@mui/x-data-grid-pro': 9.8.0
    '@mui/x-date-pickers': 9.8.0
    '@mui/x-date-pickers-pro': 9.8.0
    '@mui/x-tree-view': 9.8.0

    # Testing utilities
    '@axe-core/playwright': 4.11.1
    '@playwright/test': ^1.58.2
    '@testing-library/react': ^14.3.1
    '@testing-library/jest-dom': ^6.8.0
    '@testing-library/user-event': ^14.6.1
    happy-dom: ^20.8.8

    # State Management & Data Fetching
    '@tanstack/react-query': ^5.62.13

    # UI Notifications
    notistack: ^3.0.1

    # TypeScript types
    '@types/node': ^22.19.18

    # Linting and formatting
    eslint: ^8.57.1

    # Utilities
    dayjs: ^1.11.18
    axios: 1.13.2
    '@justrelate/slugify': ^1.0.1
    json-stable-stringify: ^1.0.0

    # Metahub package wrappers
    playcanvas: 2.21.4
    sharedb: 3.3.2
    ws: 8.20.1
    '@types/sharedb': 3.3.13
    '@types/ws': ^8.18.1
    busboy: ^1.6.0
    '@types/busboy': ^1.5.4
    '@colyseus/core': 0.17.50
    '@colyseus/sdk': 0.17.43
    '@colyseus/schema': 4.0.31
    '@colyseus/ws-transport': 0.17.13

    # Rate limiting - updated to latest stable
    express-rate-limit: ^8.2.0
    rate-limit-redis: ^4.2.3
    ioredis: ^5.8.2
    async-mutex: ^0.5.0

    # Knex - SQL query builder for runtime DDL (schema generation)
    knex: ^3.1.0

    # UUID utilities
    uuidv7: ^1.1.0

    # HTTP error handling
    http-errors: ^2.0.0
    '@types/http-errors': ^2.0.4

    # Form validation
    zod: ^3.25.76
    react-hook-form: ^7.54.2
    '@hookform/resolvers': ^3.9.1

    # React utilities
    html-react-parser: ^5.1.10
    use-debounce: ^10.0.6
    framer-motion: ^10.16.4
    react-perfect-scrollbar: ^1.5.8
    qrcode: ^1.5.4
    react-markdown: ^8.0.6
    react-syntax-highlighter: ^15.5.0
    react-datepicker: ^4.21.0
    react-code-blocks: ^0.1.6
