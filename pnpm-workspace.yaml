    '@swc/core': true
    esbuild: true
    sass-embedded: true
    sqlite3: true
    supabase: true
    '@mui/x-telemetry': false
    '@parcel/watcher': false
    '@scarf/scarf': false
    aws-sdk: false
    msgpackr-extract: false
    msw: false
    protobufjs: false

