name: Node CI
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - '*'
permissions:
    contents: read
jobs:
    build:
        strategy:
            matrix:
                platform: [ubuntu-latest]
                node-version: [22.22.0]
        runs-on: ${{ matrix.platform }}
        env:
            PUPPETEER_SKIP_DOWNLOAD: true
            TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - run: pnpm install
            - name: Check catalog versions
              run: pnpm check:catalog-versions
            - name: Check MUI v9 migration policy
              run: pnpm check:mui-v9-policy && pnpm test:mui-v9-policy
            - name: Check zod resolution
              run: pnpm check:zod-resolution
            - name: Check PlayCanvas Editor schema vocabulary
              run: pnpm check:playcanvas-editor-schema-vocabulary
            - name: Check i18n key coverage
              run: pnpm check:i18n-coverage
            - run: pnpm check:runtime-support-cycles
            - name: Check flattened package layout
              run: pnpm check:no-package-base-paths
            - name: Check package naming convention
              run: pnpm check:package-naming
            - name: Check apps-template isolation
              run: pnpm check:apps-template-isolation
            - name: Check PlayCanvas Editor isolation
              run: pnpm check:playcanvas-editor-isolation
            - run: pnpm lint
            - name: Check PlayCanvas Editor package
              run: |
                  node -e "const [major,minor,patch]=process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && (minor < 22 || (minor === 22 && patch < 0)))) process.exit(1)"
                  pnpm --filter @universo-react/playcanvas-editor-frontend test
                  pnpm --filter @universo-react/playcanvas-editor-frontend editor:build
                  pnpm --filter @universo-react/playcanvas-editor-frontend editor:smoke
                  pnpm --filter @universo-react/playcanvas-editor-frontend exec playwright install --with-deps chromium
                  pnpm --filter @universo-react/playcanvas-editor-frontend editor:browser-smoke
            - name: Lint database access standard
              run: node tools/lint-db-access.mjs
            - name: Check LMS runtime release gates
              run: |
                  pnpm run check:runtime-no-lms-forks
                  pnpm run check:lms-fixture-contract
            - name: Check MMOOMM app runtime release gates
              run: pnpm run check:mmoomm-app-fixture-contract
            - name: Check 73rd Meridian product fixture gate
              run: pnpm run check:73rd-meridian-fixture-contract
            - run: pnpm build
            - name: Check landing runtime unit, provenance and marketing gates
              run: pnpm test:landing-runtime-unit-gate
            - name: Check Marketing Hero contracts and authoring/runtime unit gates
              run: pnpm test:marketing-hero-unit-gate
            - name: Check MMOOMM app UI-first fixture generator gate
              run: pnpm run test:e2e:mmoomm-app-gate:local-supabase
            - name: Check 73rd Meridian public runtime in a real browser
              run: pnpm run test:e2e:73rd-meridian-fixture-runtime
              env:
                  UNIVERSO_ENV_FILE: .env.e2e.local-supabase
                  UNIVERSO_FRONTEND_ENV_FILE: packages/universo-react-core-frontend/.env.e2e.local-supabase
            - name: Check Marketing Hero full browser and visual verification
              run: pnpm run test:e2e:marketing-page:verify:local-supabase
            - name: Upload Marketing Hero verification evidence
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: marketing-hero-verification-evidence
                  path: tools/testing/e2e/.artifacts/marketing-page/
                  if-no-files-found: error
                  retention-days: 7
            - name: Check metahub records integrity against real PostgreSQL
              run: pnpm run test:records-integration:local-supabase
            - name: Check application alias integrity against real PostgreSQL
              run: pnpm run test:applications-integration:local-supabase
            - name: Check Marketing Hero binding races in Chromium against real PostgreSQL
              run: pnpm run test:marketing-hero-integration:local-supabase
            - name: Stop local E2E Supabase
              if: always()
              run: node tools/testing/e2e/support/stopLocalSupabaseWithRunLock.mjs
            - name: Upload browser reports, traces, and screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: marketing-hero-browser-evidence
                  path: |
                      test-results/
                      playwright-report/
                      tools/testing/e2e/.artifacts/marketing-page-authoring/
                      tools/testing/e2e/.artifacts/marketing-hero-integration/
                  if-no-files-found: ignore
                  retention-days: 7
