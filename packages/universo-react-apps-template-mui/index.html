<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apps Template MUI (MFE)</title>
    <!-- MUI color-scheme init (TZ §14.1): applies the persisted/system mode
         before first paint to avoid a dark-mode flash. Attribute must match
         colorSchemeSelector in AppTheme ('data-mui-color-scheme'). -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('mui-mode')
          if (!mode || mode === 'system') {
            mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-mui-color-scheme', mode)
        } catch (e) {
          /* storage or matchMedia unavailable — provider will set it on mount */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
